name: Publish Docker Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visualizer-container-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/2listic/coral-visualizer

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: run-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - name: Validate the stable Git tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@v3
      - name: Build the native Visualizer image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=visualizer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=visualizer-${{ matrix.arch }}
      - name: Run the unit tests
        run: |
          docker run --rm "$IMAGE:$TAG" micromamba run -n coral \
            pytest -q tests/ --ignore-glob='tests/test_e2e*.py'
      - name: Verify the published command starts the HTTP server
        run: |
          visualizer=$(docker run -d -p 127.0.0.1::8080 "$IMAGE:$TAG")
          trap 'docker logs "$visualizer"; docker rm -f "$visualizer" >/dev/null' EXIT
          endpoint=$(docker port "$visualizer" 8080/tcp)
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 "http://$endpoint/" -o /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$visualizer")" == false ]]; then
              exit 1
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.repository == '2listic/coral-visualizer'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested architecture
        if: github.event_name != 'pull_request' && github.repository == '2listic/coral-visualizer'
        run: docker push "$IMAGE:$TAG"

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.repository == '2listic/coral-visualizer'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked images as a multi-architecture index
        run: |
          tag=main
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag=$GITHUB_REF_NAME; fi
          images=()
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect "$IMAGE:run-$GITHUB_RUN_ID-$arch" \
              --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            images+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$tag" --tag "$IMAGE:sha-$GITHUB_SHA" "${images[@]}"
          anonymous=$(mktemp -d)
          trap 'rm -rf -- "$anonymous"' EXIT
          DOCKER_CONFIG="$anonymous" docker manifest inspect "$IMAGE:$tag" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] |
              (index("amd64") != null and index("arm64") != null)'

  latest:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency:
      group: ghcr-release-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the highest published stable release
        run: bash scripts/publish_latest_container.sh "$IMAGE"
